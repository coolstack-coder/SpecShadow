<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420"><rect width="100%" height="100%" fill="#fbfaf6"/>
<text x="30" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#141414" font-weight="bold" text-anchor="start">A paused process is safe. A stopped clock is not.</text>
<text x="30" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#5c5c5c" font-weight="normal" text-anchor="start">Runs where TLC found a linearizability violation (StaleRead), AegisDB unmodified</text>
<text x="30" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#141414" font-weight="bold" text-anchor="start">normal clock</text>
<text x="30" y="168" font-family="Menlo, SF Mono, Consolas, monospace" font-size="13" fill="#5c5c5c" font-weight="normal" text-anchor="start">chaos, 20 runs</text>
<rect x="430" y="130" width="420" height="34" fill="white" stroke="#141414" stroke-width="1"/>
<rect x="430" y="130" width="0.0" height="34" fill="#141414" stroke="#141414" stroke-width="1"/>
<text x="864" y="154" font-family="Menlo, SF Mono, Consolas, monospace" font-size="18" fill="#141414" font-weight="bold" text-anchor="start">0/20</text>
<text x="30" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#141414" font-weight="bold" text-anchor="start">read stalls after lease check</text>
<text x="30" y="254" font-family="Menlo, SF Mono, Consolas, monospace" font-size="13" fill="#5c5c5c" font-weight="normal" text-anchor="start">3x election timeout</text>
<rect x="430" y="216" width="420" height="34" fill="white" stroke="#141414" stroke-width="1"/>
<rect x="430" y="216" width="0.0" height="34" fill="#141414" stroke="#141414" stroke-width="1"/>
<text x="864" y="240" font-family="Menlo, SF Mono, Consolas, monospace" font-size="18" fill="#141414" font-weight="bold" text-anchor="start">0/10</text>
<text x="30" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#141414" font-weight="bold" text-anchor="start">leader's clock stops</text>
<text x="30" y="340" font-family="Menlo, SF Mono, Consolas, monospace" font-size="13" fill="#5c5c5c" font-weight="normal" text-anchor="start">suspended VM</text>
<rect x="430" y="302" width="420" height="34" fill="white" stroke="#141414" stroke-width="1"/>
<rect x="430" y="302" width="420.0" height="34" fill="#b42318" stroke="#141414" stroke-width="1"/>
<text x="864" y="326" font-family="Menlo, SF Mono, Consolas, monospace" font-size="18" fill="#b42318" font-weight="bold" text-anchor="start">10/10</text>
</svg>
